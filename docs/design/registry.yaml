# Registry of Design Screens (DS-) — P10 Sibiu
# Status: APPROVED (confirmed and approved by user on 2026-11-21)
# Reference: README.md (Scope), SPEC.md (Requirements), and DESIGN.md (Originle Aesthetic)

screens:
  - id: DS-01
    name: "Ecran principal (Explorer) — Hartă interactivă și catalog unități deschise / gardă"
    status: approved
    route: "/"
    type: page
    description: >
      Vizualizare de bază cu split-screen 42/58 pe desktop (hartă stânga, listă carduri derulabilă dreapta)
      și comutator pe mobil (Listă ⟷ Hartă). Include bara de filtrare (Toate, Farmacii, Urgențe Veterinare),
      filtre rapide chips (Deschis Acum, De Gardă / Non-Stop), selector dropdown de localitate
      (Sibiu, Mediaș, Cisnădie, Șelimbăr etc.) și căutare text. Cardurile sunt stilizate conform esteticii
      Originle (Screenshot 3) cu index mare, badge semantic, distanță GPS, buton apel rapid și favorite.
    scope_ref:
      - "README.md: 1.2 (pct. 1, 2, 3)"
      - "SPEC.md: Secțiunea 4 (Ecranul 1)"
      - "PATTERNS.md: PATTERN-001 (Split-screen & mobile toggle), PATTERN-002 (Warm Editorial Minimalist)"
    key_components:
      - SearchCityCapsule (Input căutare și dropdown oraș unificat)
      - DomainAndStatusFilterChips
      - InteractiveSibiuMap (Pini custom, tooltip flotant)
      - FacilityCardsList (Originle catalog style, index num, call pill, favorite button)
      - MobileViewToggle (Listă ⟷ Hartă)
    mock_file: "docs/design/mocks/full-site-prototype.html#ds01"
    mock_status: "approved"

  - id: DS-02
    name: "Panou detalii unitate și sesizare orar specific"
    status: approved
    route: "/facility/:id"
    type: modal_or_drawer
    description: >
      Vedere detaliată a unității selectate. Hero card cu date de contact, distanță GPS de la Piața Mare,
      acțiuni 1-tap (Apelează direct, Traseu Google Maps, Salvează la favorite), tabel program săptămânal
      cu pauze și ore de gardă, etichete servicii medicale sau veterinare autorizate și lista sesizărilor
      active raportate pentru acea unitate cu buton de confirmare (D-001).
    scope_ref:
      - "README.md: 1.2 (pct. 3, 4)"
      - "SPEC.md: Secțiunea 4 (Ecranul 2)"
      - "DECISIONS.md: D-001 (8 Confirmări comunitare), D-003 (Auth required for reporting)"
    key_components:
      - FacilityHeroCard (Nume, tipologie 💊/🐾, status badge)
      - WeeklyScheduleTable (Luni–Duminică, pauze de prânz, ture nocturne)
      - ServicesTagsGroup (Rețete compensate, receptură, analize vet etc.)
      - FacilityActiveCorrectionsList (Confirmare vot live către pragul de 8)
      - ScheduleCorrectionForm (Propunere orar modificat sau pauză)
    mock_file: "docs/design/mocks/full-site-prototype.html#ds02"
    mock_status: "approved"

  - id: DS-03
    name: "Ghid de Urgență și Numere Utile Sibiu (Above-the-Fold Hotlines)"
    status: approved
    route: "/urgente"
    type: page
    description: >
      Ghid de urgență și triaj cu numerele critice de asistență situate chiar în partea de sus a paginii,
      vizibile imediat fără scroll (Above the fold): Numărul unic 112 (card inversat cu urgență maximă),
      Spitalul Veterinar Transilvania 24/7 (0369 991), Colegiul Farmaciștilor Sibiu (0269 211 333) și DSVSA Sibiu
      (0269 223 069). Sub numerele de urgență sunt prezentate cardurile stat hero și grila 3x2 cu cei 6 pași
      numerotați de triaj nocturn (stil Originle Screenshot 1 & 2).
    scope_ref:
      - "README.md: 1.2 (pct. 7)"
      - "SPEC.md: Secțiunea 4 (Ecranul 6)"
    key_components:
      - TopEmergencyHotlinesGrid (112, Spital Vet Transilvania 24/7, Colegiul Farmaciștilor, DSVSA)
      - HeroStatCards (24/7 servicii, 8 confirmări comunitare, 4 linii oficiale)
      - NumberedTriageStepsGrid (01–06, pasul 04 pe suprafață cărbune inversată)
    mock_file: "docs/design/mocks/full-site-prototype.html#ds03"
    mock_status: "approved"

  - id: DS-04
    name: "Favoritele mele și Autentificare"
    status: approved
    route: "/auth & /favorites"
    type: page_or_modal
    description: >
      Pagină dedicată unităților salvate de utilizator:
      1) Pentru vizitatori (ANON): afișează un banner explicativ și butoane de conectare rapidă 1-Click
         (USER, MODERATOR, ADMIN) conform regulilor RBAC (D-003).
      2) Pentru utilizatori autentificați: afișează grila de carduri de unități favorite, cu calcul live al
         statusului în fusul orar Europe/Bucharest și acțiune de apel rapid.
    scope_ref:
      - "README.md: 1.2 (pct. 6)"
      - "SPEC.md: Secțiunea 4 (Ecranele 3 și 4)"
      - "DECISIONS.md: D-003 (Ierarhie 4 roluri: ANON, USER, MODERATOR, ADMIN)"
    key_components:
      - AnonAuthPromptBox (1-Click demo logins)
      - FavoritesCatalogGrid (Carduri favorite cu apel rapid și ștergere)
      - EmptyFavoritesBanner
    mock_file: "docs/design/mocks/full-site-prototype.html#ds04"
    mock_status: "approved"

  - id: DS-05
    name: "Panou Moderare & Administrare (Restricționat: MODERATOR & ADMIN Only)"
    status: approved
    route: "/admin"
    type: page
    description: >
      Panou de gestiune securizat complet ascuns din navigație pentru ANON și USER conform D-003:
      1) MODERATOR: vede fila de Coadă de Moderare sesizări/conflicte, contor progres 8 confirmări (D-001)
         și decizii rapide (Aprobă/Respinge). Taburile de Gestiune Unități și Import CSV sunt dezactivate.
      2) ADMIN: acces nerestricționat la toate modulele: Coada de moderare, Gestiune Unități (adăugare/editare)
         și Importul tabelar CSV pentru rotațiile lunare de gardă (C-004) cu parser și validare live.
    scope_ref:
      - "README.md: 1.2 (pct. 4, 5)"
      - "SPEC.md: Secțiunea 4 (Ecranul 5)"
      - "DECISIONS.md: D-001 (8 Confirmări), D-003 (Ierarhie 4 roluri: ANON, USER, MODERATOR, ADMIN)"
      - "CONTRACTS.md: C-003 (Corrections API), C-004 (CSV Import API)"
    key_components:
      - AdminRoleProtectionGuard (Complet ascuns în meniu pentru ANON și USER)
      - CorrectionsReviewQueue (Carduri sesizări, contor confirmări, butoane decizie)
      - FacilityManagementPanel (Tabel unități, acțiuni editare/ștergere, doar ADMIN)
      - CsvDropzone & TablePreview (Validare coloane rotație gardă, doar ADMIN)
    mock_file: "docs/design/mocks/full-site-prototype.html#ds05"
    mock_status: "approved"

  - id: DS-06
    name: "Pagina de Sesizări Comunitare și Orar Real (Regula celor 8 confirmări)"
    status: approved
    route: "/sesizari"
    type: page
    description: >
      Pagină publică dedicată transparenței orarelor din județul Sibiu. Permite oricărui cetățean să vadă
      sesizările active de program (pauze neanunțate, închideri temporare, modificări ture), progresul voturilor
      spre pragul de 8 confirmări (D-001) și să confirme (+1 Vot) o sesizare observată pe teren. Include formularul
      deschis pentru trimiterea unei noi sesizări pentru orice unitate medicală sau veterinară din catalog.
    scope_ref:
      - "README.md: 1.2 (pct. 4)"
      - "SPEC.md: Secțiunea 4 (Ecranul 2 și 5)"
      - "DECISIONS.md: D-001 (Regula celor 8 confirmări comunitare)"
    key_components:
      - CommunityReportsHeader & RuleBanner (Explicație regulă 8 confirmări D-001)
      - ActiveCorrectionsFeed (Carduri sesizări, bară progres x/8, vot live, status temporar aprobat)
      - NewCorrectionForm (Selector unitate Sibiu, tip modificare, notă, ore propuse)
    mock_file: "docs/design/mocks/full-site-prototype.html#ds06"
    mock_status: "approved"

